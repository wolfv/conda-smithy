[workspace]
members = ["crates/smithy-core", "crates/smithy-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
repository = "https://github.com/conda-forge/conda-smithy"
description = "A Rust rewrite of conda-smithy: lint recipes and (re-)render feedstock CI with user-scriptable rules and templates"

[workspace.dependencies]
smithy-core = { path = "crates/smithy-core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fs-err = "3"
minijinja = { version = "2", features = ["loader", "json"] }
regex = "1"
rhai = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
walkdir = "2"

[profile.release]
lto = "thin"
strip = true
